<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Drive!</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel='stylesheet' href='style.css'>
</head>
<body>

    <div id="gameContainer">

        <div id="game">

            <div id="firstpage">
                <h1 id="heading">WRONG DIRECTION DRIVER</h1>
                <button id="scenarioselector">SELECT SCENE</button>
                
                
                    <select id="difficulty">
                        <option value="easy">Easy</option>
                        <option value="medium">Medium</option>
                        <option value="hard">Hard</option>
                    </select>

                <button id="startbtn">START</button>

                <button id="mute">Mute</button>

                <h3 id="chooosecar">CHOOSE YOUR CAR</h3>

                <div id="carshowcase">
                    <button id="previouscar">❮</button>

                    <div id="carpodium">
                        <img  id="currentcar" src="assets/ferrari.png">
                        <div id="podium"></div>
                    </div>

                    <button id="nextcar">❯</button>
                </div>  
            </div>

        <div id="countdown"></div>

            <div id = "gamestats">
                <p>Score : <span id="score"></span></p>
                <p>Distance : <span id="distance"></span></p>
                <p>Cars Dodged : <span id="carsgone"></span></p>
            </div>

            <div class="road">
                <div class="playercar"></div>
                <div class="laneline" id="line1"></div>
                <div class="laneline" id="line2"></div>
            </div>

            <div class="gameover">
                <h1>GAME OVER</h1>
                <p >Score : <span id="finalscore"></span></p>
                <p >Distance : <span id="finaldistance"></span></p>
                <p >Cars Dodged : <span id="finaldodged"></span></p>
                <button id="gameoverbtn">RESTART</button>

            </div>
        </div>
    </div>        
    
    <script src="script.js"></script>
</body>
</html>
